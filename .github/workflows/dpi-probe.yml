name: DPI probe (throwaway)
on:
  push:
    branches: [ci-trial/dpi-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Probe display scaling
        shell: cmd
        run: '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\dpi-probe.ps1'
      - name: Pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dpi-probe
          path: ${{ runner.temp }}/dpi-probe
