name: Release

# Makes a draft release for a tag that already exists. Nothing here publishes anything: making the draft public is a person's
# click on GitHub, after the draft's own files have been verified (RELEASING.md).
#
# Who may run this is decided outside this file. The `attest` and `draft` jobs run in the GitHub environment `release`, whose
# deployment rule allows only `main` and which waits for the repository owner's approval; a dispatch from any other branch,
# whatever its copy of this file says, cannot enter that environment, so it can neither sign nor draft. A tag ruleset on
# `v*` lets only the owner create a release tag and lets nobody move or delete one.
#
# The jobs, each holding only what it needs:
#   authorize  read-only. Runs the guard from main's own commit (the workflow's), before anything of the tag is fetched into
#              a build: the tag is a plain release tag on main, the version agrees, and every job of CI's push run on main
#              for that commit succeeded on its latest attempt (scripts/release-guard.mjs).
#   build      read-only. The reusable workflow that CI runs on every push: it builds the installer from the tag's commit and
#              runs the installer's smoke checks on those exact bytes. A release restores no cache (fresh-tools).
#   inspect    no rights. The installer is the file the build output (its digest), named for the tag's version, with that
#              version inside it.
#   attest     signs, no checkout. The installer's digest, by digest: GitHub's build provenance, and a second statement
#              that binds the tag, the tag's commit and the digest together.
#   draft      writes the release, no checkout. Any earlier draft for the tag is deleted, the new draft gets the installer, its
#              .sha256 and both bundles, everything is downloaded again and compared, and any failure deletes the draft.
#
# The jobs that sign and publish have no checkout: the guard reaches them as one file from the first job, and each checks its
# digest before running it. The tag's name is a workflow input and reaches the guard only through an environment variable;
# every later job takes it from the guard's own output, after the guard checked its shape.
#
# The approval window: `attest` and `draft` each wait for a person's approval. Everything they download (the guard, the tested
# installer, the attestation bundles) is kept for seven days, the installer's retention in build-installer.yml, so an approval
# up to a week late still finds all of it; after that the release is started again.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, for example v0.1.1. It must already exist, on main.
        required: true
        type: string

permissions: {}

# One release at a time; a second run waits for the first to end rather than cancelling it half-way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  authorize:
    name: "Authorize: the tag, main and every CI job"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
      source: ${{ steps.guard.outputs.source }}
      version: ${{ steps.guard.outputs.version }}
      guard-sha256: ${{ steps.fingerprint.outputs.sha256 }}
    steps:
      # The workflow's own commit (main's), with all history: the guard needs it to tell whether the tag's commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
      - name: Check the tag, main and every CI job
        id: guard
        env:
          TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-guard.mjs authorize
      - name: Take the guard's digest
        id: fingerprint
        shell: bash
        run: |
          hash=$(sha256sum scripts/release-guard.mjs | cut -d ' ' -f 1)
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
      - name: Keep the guard for the jobs that sign and publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-guard
          path: scripts/release-guard.mjs
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # The installer that ships is the one that was smoke-tested: the same reusable workflow CI runs, on the tag's commit.
  build:
    name: Build and smoke-test the installer
    needs: authorize
    permissions:
      contents: read
    uses: ./.github/workflows/build-installer.yml
    with:
      source: ${{ needs.authorize.outputs.source }}
      fresh-tools: true

  inspect:
    name: Inspect the built installer
    needs: [authorize, build]
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Fetch the guard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-guard
          path: ${{ runner.temp }}/guard
      - name: Check the guard is the file the first job ran
        shell: pwsh
        env:
          GUARD: ${{ runner.temp }}/guard/release-guard.mjs
          GUARD_SHA256: ${{ needs.authorize.outputs.guard-sha256 }}
        run: |
          $hash = (Get-FileHash $env:GUARD -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:GUARD_SHA256) { throw "the guard's digest is $hash, not $env:GUARD_SHA256" }
      - name: Fetch the installer the build smoke-tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/installer
      - name: Check the installer is the file the build output
        id: installer
        shell: pwsh
        env:
          GUARD: ${{ runner.temp }}/guard/release-guard.mjs
          INSTALLER_DIR: ${{ runner.temp }}/installer
          VERSION: ${{ needs.authorize.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: node $env:GUARD check-installer
      # The version inside the installer is what Windows shows for it: it must be the tag's.
      - name: Check the version inside the installer
        shell: pwsh
        env:
          GUARD: ${{ runner.temp }}/guard/release-guard.mjs
          VERSION: ${{ needs.authorize.outputs.version }}
          INSTALLER_NAME: ${{ steps.installer.outputs.name }}
          INSTALLER_PATH: ${{ runner.temp }}/installer/${{ steps.installer.outputs.name }}
        run: |
          $info = (Get-Item -LiteralPath $env:INSTALLER_PATH).VersionInfo
          $env:PRODUCT_VERSION = $info.ProductVersion
          $env:FILE_VERSION = $info.FileVersion
          node $env:GUARD check-embedded-version

  attest:
    name: Attest the installer
    needs: [authorize, build, inspect]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Fetch the guard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-guard
          path: ${{ runner.temp }}/guard
      - name: Check the guard is the file the first job ran
        shell: bash
        env:
          GUARD: ${{ runner.temp }}/guard/release-guard.mjs
          GUARD_SHA256: ${{ needs.authorize.outputs.guard-sha256 }}
        run: echo "$GUARD_SHA256  $GUARD" | sha256sum --check --strict -
      - name: Fetch the installer the build smoke-tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/installer
      - name: Check the installer is the file the build output
        id: installer
        shell: bash
        env:
          GUARD: ${{ runner.temp }}/guard/release-guard.mjs
          INSTALLER_DIR: ${{ runner.temp }}/installer
          VERSION: ${{ needs.authorize.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: node "$GUARD" check-installer
      - name: Write the statement that binds the tag, the commit and the installer
        shell: bash
        env:
          GUARD: ${{ runner.temp }}/guard/release-guard.mjs
          TAG: ${{ needs.authorize.outputs.tag }}
          SOURCE: ${{ needs.authorize.outputs.source }}
          VERSION: ${{ needs.authorize.outputs.version }}
          NAME: ${{ steps.installer.outputs.name }}
          SHA256: ${{ steps.installer.outputs.sha256 }}
          OUT: ${{ runner.temp }}/release-binding.json
        run: node "$GUARD" write-binding
      - name: Attest the build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.installer.outputs.name }}
          subject-digest: ${{ steps.installer.outputs.digest }}
      - name: Attest the bound statement
        id: binding
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.installer.outputs.name }}
          subject-digest: ${{ steps.installer.outputs.digest }}
          predicate-type: https://github.com/sumguywhowantstobuild/petalock/release-binding/v1
          predicate-path: ${{ runner.temp }}/release-binding.json
      - name: Check both bundles and keep them under fixed names
        shell: bash
        env:
          GUARD: ${{ runner.temp }}/guard/release-guard.mjs
          TAG: ${{ needs.authorize.outputs.tag }}
          SOURCE: ${{ needs.authorize.outputs.source }}
          VERSION: ${{ needs.authorize.outputs.version }}
          NAME: ${{ steps.installer.outputs.name }}
          SHA256: ${{ steps.installer.outputs.sha256 }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          BINDING_BUNDLE: ${{ steps.binding.outputs.bundle-path }}
          OUT_DIR: ${{ runner.temp }}/bundles
        run: node "$GUARD" collect-bundles
      - name: Keep the bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation-bundles
          path: ${{ runner.temp }}/bundles
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  draft:
    name: Make the draft release
    needs: [authorize, build, inspect, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Fetch the guard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-guard
          path: ${{ runner.temp }}/guard
      # The clean-up step below runs this file with the write token, so it checks this step's outcome before it does.
      - name: Check the guard is the file the first job ran
        id: guard-check
        shell: bash
        env:
          GUARD: ${{ runner.temp }}/guard/release-guard.mjs
          GUARD_SHA256: ${{ needs.authorize.outputs.guard-sha256 }}
        run: echo "$GUARD_SHA256  $GUARD" | sha256sum --check --strict -
      - name: Fetch the installer the build smoke-tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/installer
      - name: Fetch the two attestation bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attestation-bundles
          path: ${{ runner.temp }}/bundles
      - name: Check the installer is the file the build output
        shell: bash
        env:
          GUARD: ${{ runner.temp }}/guard/release-guard.mjs
          INSTALLER_DIR: ${{ runner.temp }}/installer
          VERSION: ${{ needs.authorize.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: node "$GUARD" check-installer
      # The draft's id is written to DRAFT_ID_FILE the moment the draft exists. Everything the guard uploads is downloaded
      # again and compared before this step ends; a failure inside it deletes the draft itself.
      - name: Make the draft release, upload the files and check them
        id: draft
        shell: bash
        env:
          GUARD: ${{ runner.temp }}/guard/release-guard.mjs
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.authorize.outputs.tag }}
          SOURCE: ${{ needs.authorize.outputs.source }}
          VERSION: ${{ needs.authorize.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          INSTALLER_DIR: ${{ runner.temp }}/installer
          BUNDLES_DIR: ${{ runner.temp }}/bundles
          DRAFT_ID_FILE: ${{ runner.temp }}/draft-id.txt
        run: node "$GUARD" draft
      # What the step above could not clean up (the job cancelled or timed out half-way): the recorded draft, and only while it
      # is still a draft. It runs only after the guard passed its digest check and the draft step has started: a guard that
      # failed that check is never run with the write token. Nothing runs after this step, so a draft that passed its checks
      # is never deleted here.
      - name: Delete the draft if this job did not finish
        if: ${{ (failure() || cancelled()) && steps.guard-check.outcome == 'success' && steps.draft.outcome != 'skipped' }}
        shell: bash
        env:
          GUARD: ${{ runner.temp }}/guard/release-guard.mjs
          GITHUB_TOKEN: ${{ github.token }}
          DRAFT_ID_FILE: ${{ runner.temp }}/draft-id.txt
        run: node "$GUARD" discard-draft
