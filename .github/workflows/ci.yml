name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# One run per branch and event: a newer push cancels the older push run, and a newer pull_request run the older
# one. Push and pull_request runs never cancel each other: a cancelled required check on the head commit counts as a
# failure and blocks the merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    name: "Rust: format, lint, test (${{ matrix.label }})"
    # Windows is the shipped target; Linux compiles and tests the portable file code too.
    # Images are pinned so CI changes only when we bump them; the label keeps the check name
    # (required by branch protection) the same across bumps.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            os: windows-2025-vs2026
            packages: --workspace
          - label: linux
            os: ubuntu-24.04
            # The desktop app is Windows-only; building it on Linux would need WebKitGTK for nothing.
            packages: --workspace --exclude petalock-desktop
    runs-on: ${{ matrix.os }}
    # The Windows run also builds the UI and a release build of the app. A pull request's first run has no cache
    # (branch caches do not reach it) and compiles everything, which has run past 45 minutes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The app embeds the built UI at compile time, so the UI is built before the Rust steps.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.label == 'windows'
        with:
          node-version-file: ui/.node-version
      - name: Install UI dependencies
        if: matrix.label == 'windows'
        working-directory: ui
        run: npm ci --ignore-scripts
      - name: Build UI
        if: matrix.label == 'windows'
        working-directory: ui
        run: npm run build
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Show toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets ${{ matrix.packages }} -- -D warnings
      # The engine's private modules, failpoints and the integration tests that build on them (`test-internals`).
      - name: Lint (engine internals)
        run: cargo clippy -p petalock-core --locked --all-targets --features test-internals -- -D warnings
      - name: Test
        run: cargo test --locked ${{ matrix.packages }}
      # Integration tests only: the engine's unit and doc tests already ran in "Test", without the feature.
      - name: Test (engine internals)
        run: cargo test -p petalock-core --locked --features test-internals --test '*'
      # The only run where release-only checks (`cfg(not(dev))`, such as refusing the dev server) are compiled in.
      - name: Bridge tests (release configuration)
        if: matrix.label == 'windows'
        run: cargo test -p petalock-desktop --locked --features custom-protocol --test ipc
      - name: Tauri build
        if: matrix.label == 'windows'
        run: cargo build -p petalock-desktop --release --locked --features custom-protocol

  ui:
    name: "UI: lint, test, build"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      # Before Test: a test reads the built style sheet to check that no font became a data: URI.
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      # ui/osv-scanner.toml accepts advisories in build tools as "never shipped": this proves it on every push.
      - name: Shipped page holds no build-tool code
        run: node ../scripts/shipped-page-check.mjs
      # The scan job runs the scanner tests without the UI installed, so their real-build half skips there: run here, it proves the check can still fail.
      - name: Shipped page check fails on build-tool code
        run: node --test ../scripts/shipped-page-check.test.mjs

  scan:
    name: Security scan
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks reads the whole git history
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install semgrep
        run: pip install semgrep==1.179.0
      - name: Install gitleaks and osv-scanner (SHA-256 checked)
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'scan-tools'
          New-Item -ItemType Directory -Force $bin | Out-Null
          function Get-Verified($url, $sha256, $path) {
            Invoke-WebRequest $url -OutFile $path
            if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $sha256) { throw "SHA-256 mismatch for $url" }
          }
          $zip = Join-Path $bin 'gitleaks.zip'
          Get-Verified 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e' $zip
          Expand-Archive $zip -DestinationPath $bin
          Get-Verified 'https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_windows_amd64.exe' '9964ed64ec9a387391eb4cc006ad5c531154821aef29b793e02c448de4686438' (Join-Path $bin 'osv-scanner.exe')
          "PETALOCK_GITLEAKS=$bin\gitleaks.exe" >> $env:GITHUB_ENV
          "PETALOCK_OSV=$bin\osv-scanner.exe" >> $env:GITHUB_ENV
      - name: Scanner tests
        run: node --test "scripts/*.test.mjs"
      - name: Scan
        env:
          PETALOCK_SEMGREP: semgrep
        run: node scripts/scan.mjs

  # End-to-end tests on the real app: the shipped (release) build, driven through tauri-driver and the image's Edge
  # WebDriver. Not a required check (branch protection is not changed): a failure shows on the run and is fixed
  # first, but it does not block a merge. After the Rust job, so a build that is already broken is not built again.
  # The job runs elevated, where WebView2 ignores the driver's settings: the driven launches get WebView2's machine policy
  # for petalock.exe instead, set and removed around each one (e2e/lib/app.mjs).
  e2e:
    name: "End-to-end: the real app (windows)"
    needs: rust
    runs-on: windows-2025-vs2026
    # A first run has no cache and builds the app from nothing.
    timeout-minutes: 60
    env:
      # The marker only this job sets: it skips the swap of a fresh runner's state and allows the clipboard steps. The
      # generic CI=true grants neither.
      PETALOCK_E2E_CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
      # The app embeds the built page, so the page's dependencies come first (scripts/e2e.mjs builds it).
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --ignore-scripts
      - name: Install end-to-end dependencies
        working-directory: e2e
        run: npm ci --ignore-scripts
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # tauri-driver is built once and kept: the key names its version, so a new version is a new cache.
      - name: Cache tauri-driver
        id: tauri-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-2.1.0-${{ runner.os }}
      - name: Install tauri-driver
        if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked --version 2.1.0
      # The driver and the web-view runtime must share a major version; the run refuses otherwise, and says both.
      - name: Show the web-view runtime and the Edge WebDriver versions
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          "WebView2 runtime: $((Get-ItemProperty $key -ErrorAction SilentlyContinue).pv)"
          "EDGEWEBDRIVER: $env:EDGEWEBDRIVER"
          & (Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe') --version
      # The download page, guide and not-found page in the runner's Edge: every request same-site, axe at both sizes in
      # light and dark, the contrast-theme rules (Plan 5 Task 6). Set to fail, not skip, when the driver or axe is missing.
      - name: The site in a real browser
        env:
          PETALOCK_SITE_BROWSER: "1"
        run: node --test scripts/site.test.mjs
      - name: End-to-end tests
        run: node scripts/e2e.mjs
      # A run that did not pass leaves its build and test logs in target/e2e-logs (made-up test state only, never the
      # web-view data), kept for a week to read why.
      - name: Keep the end-to-end logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: target/e2e-logs
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

  # The installer, built from this commit and smoke-tested on the bytes that were built (install, upgrade, uninstall, in
  # a clean per-user setup). Not a required check yet (branch protection is not changed): a failure shows on the run and is
  # fixed first. Side by side with the Rust job, not after it: the installer's result comes in about 25 minutes instead of
  # after the 47-minute Rust job, and a commit that fails the Rust job is still red, so it is not released. The workflow it
  # calls is read-only and is the one the release uses too, so the installer that ships is the one that was tested.
  installer:
    name: Installer
    uses: ./.github/workflows/build-installer.yml
    with:
      source: ${{ github.sha }}
