name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# One run per branch and event: a newer push cancels the older push run, and a newer pull_request run the older
# one. Push and pull_request runs never cancel each other: a cancelled required check on the head commit counts as a
# failure and blocks the merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    name: "Rust: format, lint, test (${{ matrix.label }})"
    # Windows is the shipped target; Linux compiles and tests the portable file code too.
    # Images are pinned so CI changes only when we bump them; the label keeps the check name
    # (required by branch protection) the same across bumps.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            os: windows-2025-vs2026
          - label: linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Show toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  scan:
    name: Security scan
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks reads the whole git history
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install semgrep
        run: pip install semgrep==1.179.0
      - name: Install gitleaks and osv-scanner (SHA-256 checked)
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'scan-tools'
          New-Item -ItemType Directory -Force $bin | Out-Null
          function Get-Verified($url, $sha256, $path) {
            Invoke-WebRequest $url -OutFile $path
            if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $sha256) { throw "SHA-256 mismatch for $url" }
          }
          $zip = Join-Path $bin 'gitleaks.zip'
          Get-Verified 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e' $zip
          Expand-Archive $zip -DestinationPath $bin
          Get-Verified 'https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_windows_amd64.exe' 'e0ed7644118b717b028c249ee9d3515024e55e8510747ca08906eb96765354d6' (Join-Path $bin 'osv-scanner.exe')
          "LOCKBOX_GITLEAKS=$bin\gitleaks.exe" >> $env:GITHUB_ENV
          "LOCKBOX_OSV=$bin\osv-scanner.exe" >> $env:GITHUB_ENV
      - name: Scanner tests
        run: node --test "scripts/*.test.mjs"
      - name: Scan
        env:
          LOCKBOX_SEMGREP: semgrep
        run: node scripts/scan.mjs
