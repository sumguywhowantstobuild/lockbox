[package]
name = "lockbox-core"
description = "Lockbox core: vault engine, encryption and keys"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "parallel", "zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.11", features = ["zeroize"] }
thiserror = "2"
unicode-normalization = "0.1"
zeroize = "1.9"

[dev-dependencies]
serde_json = "1"
